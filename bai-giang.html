<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phát triển web kinh doanh BIE5030</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: dải tiêu đề xanh UEL + thanh tab dính; nội dung 1 cột rộng 1080px, module chia 2 cột (danh mục mục học | nội dung) */
:root{
  --uel:#144e8c; --uel-2:#0f3d6e; --sky:#00aeef; --orange:#f05a23;
  --bg:#f5f8fc; --surface:#ffffff; --surface-2:#eaf1f9; --line:#d3deeb;
  --fg:#13263d; --muted:#53657c; --on-band:#ffffff; --band-muted:#cfe0f3;
  --ok:#1b7f4c; --warn:#b7620b; --bad:#b4261c; --ok-bg:#e3f4ea; --bad-bg:#fbe7e5;
  --code:#eef3f9;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1625; --surface:#112135; --surface-2:#172b44; --line:#24405f;
  --fg:#e5edf7; --muted:#9db0c7; --uel:#1a5ea6; --uel-2:#0d2c4f; --band-muted:#b9cde4;
  --ok:#5fd398; --warn:#f0a85a; --bad:#ff8a7e; --ok-bg:#12351f; --bad-bg:#3a1714; --code:#0e1c2e; --orange:#ff7a45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1625; --surface:#112135; --surface-2:#172b44; --line:#24405f;
  --fg:#e5edf7; --muted:#9db0c7; --uel:#1a5ea6; --uel-2:#0d2c4f; --band-muted:#b9cde4;
  --ok:#5fd398; --warn:#f0a85a; --bad:#ff8a7e; --ok-bg:#12351f; --bad-bg:#3a1714; --code:#0e1c2e; --orange:#ff7a45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--uel-2)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{text-wrap:balance;line-height:1.25;margin:0}
p{margin:0}
a{color:var(--uel)}
:root:not([data-theme="light"]) a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* band */
.band{background:linear-gradient(120deg,var(--uel-2) 0%,var(--uel) 62%,#1d6fb8 100%);color:var(--on-band)}
.band .wrap{padding-block:28px 22px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted);font-weight:500}
.band h1{font-size:clamp(28px,4.4vw,44px);font-weight:900;margin-top:8px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;color:var(--band-muted);font-size:14px}
.prog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--band-muted)}
.bar{flex:0 0 200px;height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);width:0;transition:width .4s}
.funnel-mark{width:150px;height:96px}
.band-tools{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.chip-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-size:13px}
.chip-btn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange)}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:0 0 auto;padding:13px 12px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;border-bottom:3px solid transparent}
.tabs a.on{color:var(--fg);border-bottom-color:var(--orange)}
main{padding-block:28px 64px}
.view{display:grid;gap:28px}
.lead{font-size:18px;color:var(--muted);max-width:68ch}
h2.sec{font-size:26px;font-weight:700}
h3{font-size:19px;font-weight:700}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.step b{display:inline-block;font-size:12px;color:var(--orange);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.step h4{margin:6px 0 4px;font-size:17px}
.step p{color:var(--muted);font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.btn{text-decoration:none;display:inline-block;background:var(--orange);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.blue{background:var(--uel);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* module list */
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit}
.mrow:hover{border-color:var(--uel)}
.mrow .n{font-size:26px;font-weight:900;color:var(--uel);text-align:center}
:root:not([data-theme="light"]) .mrow .n{color:var(--sky)}
.mrow .t{font-weight:700} .mrow .s{color:var(--muted);font-size:14px}
.ring{width:40px;height:40px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px;background:var(--orange);color:#fff;margin-left:6px;vertical-align:2px}
/* module page */
.mod{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:64px;display:grid;gap:12px}
.mnav{display:flex;flex-wrap:wrap;gap:6px}
.mnav a{min-width:38px;text-align:center;padding:5px 8px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--muted);font-family:var(--f-mono);font-size:13px;background:var(--surface)}
.mnav a.on{background:var(--uel);color:#fff;border-color:var(--uel)}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.items button{display:grid;grid-template-columns:1fr 18px;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:9px 10px;color:var(--fg)}
.items button small{display:block;color:var(--muted);font-size:12.5px}
.items button.on{background:var(--surface-2)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);align-self:center}
.dot.done{background:var(--ok);border-color:var(--ok)}
.content{min-width:0;display:grid;gap:18px}
.kicker{font-family:var(--f-mono);font-size:13px;color:var(--orange)}
.content h2{font-size:28px;font-weight:700}
.prose{display:grid;gap:12px;max-width:72ch}
.prose ul,.prose ol{margin:0;padding-left:22px;display:grid;gap:6px}
.callout{border-left:4px solid var(--sky);background:var(--surface-2);padding:12px 14px;border-radius:0 8px 8px 0;font-size:15px}
.callout.or{border-left-color:var(--orange)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
/* quiz */
.q{display:grid;gap:8px}
.q .opts{display:grid;gap:6px}
.q .opts button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--fg)}
.q .opts button.right{background:var(--ok-bg);border-color:var(--ok)}
.q .opts button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.q .ex{font-size:14.5px;color:var(--muted)}
/* lab */
.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:16px}
.lab-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.lab-h .k{font-family:var(--f-mono);font-size:12.5px;color:var(--orange)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 18px}
.ctrl label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);gap:8px}
.ctrl label b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.ctrl input[type=range]{width:100%;accent-color:var(--orange)}
.ctrl input[type=number],.ctrl select,textarea,input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:19px;font-weight:500}
.stat.hi{background:var(--uel);color:#fff} .stat.hi span{color:var(--band-muted)}
.predict{border:1px dashed var(--orange);border-radius:8px;padding:10px 12px;font-size:15px}
.sortq{display:grid;gap:8px}
.sortq .it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:4px 8px;font-size:13px}
.seg button.on{background:var(--uel);border-color:var(--uel);color:#fff}
.seg button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.fbar{height:30px;border-radius:5px;background:var(--uel);color:#fff;font-size:13px;display:flex;align-items:center;padding:0 10px;white-space:nowrap;min-width:fit-content;transition:width .3s}
.fun{display:grid;gap:6px}
.note{font-size:13.5px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.warn{background:var(--surface-2);color:var(--warn)}
.heat td.c{text-align:center;font-family:var(--f-mono)}
.timeline{display:grid;gap:8px}
.timeline .tl{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.timeline .tl b{font-family:var(--f-mono);color:var(--orange)}
.big-timer{font-family:var(--f-mono);font-size:64px;font-weight:500;text-align:center}
.gloss{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gloss .g b{display:block}
.gloss .g span{color:var(--muted);font-size:14.5px}
.present{font-size:19px}
.present .content h2{font-size:34px}
@media (max-width:860px){
  .grid2,.mod{grid-template-columns:1fr}
  .side{position:static}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .band .wrap{grid-template-columns:1fr}
  .funnel-mark{display:none}
  .gloss{grid-template-columns:1fr}
}
@media (max-width:480px){.grid4{grid-template-columns:1fr}.bar{flex-basis:120px}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--c1:#144e8c;--c2:#f05a23;--c3:#00aeef;--c4:#2e9e6a;--c5:#8a5cc2;--c6:#c79a1b;--c7:#d6457a;--c8:#5b6b7e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#5aa2ea;--c2:#ff7a45;--c3:#3cc8ff;--c4:#4fc58b;--c5:#b28cf0;--c6:#e3b84a;--c7:#f07aa4;--c8:#9fb0c4}}
:root[data-theme="dark"]{--c1:#5aa2ea;--c2:#ff7a45;--c3:#3cc8ff;--c4:#4fc58b;--c5:#b28cf0;--c6:#e3b84a;--c7:#f07aa4;--c8:#9fb0c4}
svg.chart{width:100%;height:auto;display:block;background:var(--surface);border-radius:8px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .ax{stroke:var(--muted);stroke-width:1}
svg.chart .tk{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .al{fill:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i,.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details.code{border:1px solid var(--line);border-radius:8px;background:var(--code)}
details.code summary{cursor:pointer;padding:9px 12px;font-size:14px;color:var(--muted)}
details.code pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.5;border-top:1px solid var(--line)}

[hidden]{display:none!important}
.lab>*,.content>*,.grid2>*{min-width:0}
.device{contain:inline-size}
.mono,textarea.mono{font-family:var(--f-mono);font-size:13.5px;line-height:1.5}
iframe.pv{width:100%;min-height:340px;border:1px solid var(--line);border-radius:8px;background:#ffffff}
.pv.sm{min-height:90px}
div.pv.safe{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);font-size:15px;white-space:pre-wrap;word-break:break-word}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14.5px}
pre.out{margin:0;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-mono);font-size:13px;overflow-x:auto;white-space:pre-wrap;min-height:2.4em}
.boxviz{display:flex;justify-content:center;padding:8px;overflow-x:auto}
.bm{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,var(--surface) 6px,var(--surface) 12px);border:1px dashed var(--muted);position:relative}
.bb{border-style:solid;border-color:var(--orange);background:color-mix(in srgb,var(--sky) 22%,var(--surface));position:relative}
.bc{background:var(--uel);color:#fff;min-height:60px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;text-align:center}
.lb{position:absolute;top:-1px;left:4px;font-size:10.5px;font-family:var(--f-mono);color:var(--muted);transform:translateY(-100%)}
.device{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);position:relative}
.screen{transform-origin:0 0;background:#f7f4ef;color:#2b2118}
.topbar{background:#5a3b22;color:#fff;padding:10px 16px;font-weight:700}
.pcard{background:#ffffff;color:#2b2118;border:1px solid #e3d9cc;border-radius:8px;padding:10px;display:grid;gap:6px;font-size:14px}
.pcard .pimg{aspect-ratio:16/9;max-width:100%;border-radius:6px;background:linear-gradient(135deg,#c9a27a,#8a5a35)}
.pcard button{background:#5a3b22;color:#fff;border:0;border-radius:6px;padding:7px;font-size:13px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shop .pcard .btn{background:#5a3b22;color:#fff;border:0}
.demo-form{min-width:0;grid-template-columns:minmax(0,1fr);display:grid;gap:10px;background:var(--surface-2);border-radius:10px;padding:14px;align-content:start}
.demo-form .ff input{width:100%;min-width:0;box-sizing:border-box}
.demo-form .ff input[type=checkbox]{width:auto}
.demo-form .ff{min-width:0;display:grid;gap:4px;font-size:14.5px}
.demo-form input[type=text],.demo-form input[type=email],.demo-form input[type=tel],.demo-form input[type=date],.demo-form input[type=number]{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
.demo-form .ff.err input{border-color:var(--bad);outline:2px solid var(--bad-bg)}
.serp{background:#ffffff;color:#202124;border:1px solid var(--line);border-radius:8px;padding:14px;font-family:Arial,sans-serif;display:grid;gap:4px}
.serp .su{font-size:13px;color:#4d5156}.serp .stt{font-size:19px;color:#1a0dab;line-height:1.3}.serp .sd{font-size:14px;color:#4d5156;line-height:1.5}
</style>

<script>
// ===== DỮ LIỆU HỌC PHẦN BIE5030 =====

const ITEMS = [

  {k:"worked", t:"Ví dụ mẫu: thử trước", s:"Thực hành · 20 phút"},

  {k:"quiz", t:"Câu hỏi luyện tập", s:"Trắc nghiệm · 10 phút"},

  {k:"wrap", t:"Tổng kết và tự đánh giá", s:"Tự đánh giá · 5 phút"}
];
const MODULES = [
{ id:1, week:"Tuần 1", title:"Website trong kinh doanh và cách web vận hành", ch:"Connolly & Hoar Ch1–2 · Felke-Morris Ch1", sub:"Vai trò của website, mô hình client–server, HTTP, URL, tên miền và hosting", clo:"CLO1",
  goals:["Xác định mục tiêu kinh doanh và loại website phù hợp: giới thiệu, bán hàng, thu thập khách hàng tiềm năng, nội dung","Giải thích mô hình client–server và chu trình yêu cầu – phản hồi HTTP","Phân tích các thành phần của URL và ý nghĩa mã trạng thái HTTP","Phân biệt tên miền, DNS, hosting và vai trò của từng thành phần"],
  prep:["Đọc Connolly & Hoar (2022), Chương 1 và 2.","Cài đặt Visual Studio Code và trình duyệt Chrome; mở công cụ DevTools (F12), xem thẻ Network khi tải một trang bán hàng.","Chọn 2 website bán hàng tại Việt Nam, ghi lại mục tiêu chính và hành động mong muốn của khách trên trang chủ."],
  ideas:[
   ["Website trong kinh doanh","Website là kênh sở hữu (owned media) của doanh nghiệp: giới thiệu thương hiệu, bán hàng, thu thập khách hàng tiềm năng (lead), chăm sóc khách hàng. Mục tiêu kinh doanh quyết định cấu trúc trang và chỉ số đo lường."],
   ["Client – server","Trình duyệt (client) gửi yêu cầu HTTP tới máy chủ (server); máy chủ trả về phản hồi gồm mã trạng thái, tiêu đề (headers) và nội dung (HTML, CSS, JS, ảnh, JSON)."],
   ["URL","Gồm giao thức (https), tên miền, đường dẫn, chuỗi truy vấn (?key=value) và phân đoạn (#). URL rõ nghĩa giúp người dùng và công cụ tìm kiếm hiểu nội dung trang."],
   ["Mã trạng thái","2xx thành công (200); 3xx chuyển hướng (301 vĩnh viễn, 302 tạm thời); 4xx lỗi phía client (403 bị cấm, 404 không tìm thấy); 5xx lỗi máy chủ (500)."]
  ],
  worked:{q:"Phân tích URL https://cuahangmau.vn/san-pham/tui-xach?mau=nau&trang=2#danh-gia: giao thức, tên miền, đường dẫn, tham số truy vấn, phân đoạn. Nếu đổi đường dẫn cũ /sp?id=15 sang đường dẫn mới, máy chủ nên trả mã trạng thái nào?",
    a:["Giao thức: https (kết nối mã hóa).","Tên miền: cuahangmau.vn; đường dẫn: /san-pham/tui-xach.","Tham số: mau = nau, trang = 2; phân đoạn: #danh-gia (trình duyệt cuộn tới phần đánh giá, không gửi lên máy chủ).","Đổi đường dẫn vĩnh viễn: trả 301 để trình duyệt và công cụ tìm kiếm chuyển sang URL mới, giữ giá trị SEO."]},
  lab:"L1",
  live:["DevTools (10 phút): cả lớp mở thẻ Network trên cùng một trang, đếm số yêu cầu và tổng dung lượng tải.","Ghép cặp (10 phút): mỗi cặp xác định mục tiêu và hành động chính (call to action) trên trang chủ của 2 website đã chọn.","Phiếu ra lớp: nêu sự khác nhau giữa tên miền và hosting."],
  case:{ctx:"Cửa hàng Mẫu (cửa hàng túi xách thủ công, tình huống giả định) đang bán qua mạng xã hội và muốn có website riêng.", qs:["Xác định 2 mục tiêu kinh doanh chính của website và chỉ số đo lường mỗi mục tiêu.","Đề xuất cấu trúc URL cho trang danh mục, trang sản phẩm, trang chính sách.","Cửa hàng cần chuẩn bị những gì về tên miền và hosting?"]},
  quiz:[
   {q:"Mã trạng thái nào cho biết trang không tồn tại?",o:["200","301","404","500"],a:2,e:"404 Not Found: tài nguyên không tồn tại trên máy chủ."},
   {q:"Phần nào của URL không được gửi lên máy chủ?",o:["Đường dẫn","Chuỗi truy vấn","Phân đoạn (#...)","Tên miền"],a:2,e:"Phân đoạn chỉ được trình duyệt xử lý."},
   {q:"DNS có vai trò gì?",o:["Lưu trữ mã nguồn website","Chuyển tên miền thành địa chỉ IP","Mã hóa dữ liệu","Tạo giao diện"],a:1,e:"DNS phân giải tên miền thành địa chỉ IP của máy chủ."},
   {q:"Chuyển URL cũ sang URL mới vĩnh viễn nên dùng mã nào?",o:["200","301","302","403"],a:1,e:"301 báo chuyển hướng vĩnh viễn, giúp giữ thứ hạng tìm kiếm."}
  ],
  wrap:["Tôi xác định được mục tiêu kinh doanh của một website.","Tôi giải thích được chu trình yêu cầu – phản hồi HTTP.","Tôi đọc được các thành phần URL và mã trạng thái."]
},
{ id:2, week:"Tuần 2", title:"HTML: cấu trúc trang và ngữ nghĩa", ch:"Connolly & Hoar Ch3 · Felke-Morris Ch2, Ch4", sub:"Thẻ HTML, cấu trúc ngữ nghĩa, liên kết, hình ảnh và khả năng truy cập", clo:"CLO1, CLO2",
  goals:["Viết tài liệu HTML đúng cấu trúc: doctype, head, body, lang, meta","Sử dụng thẻ ngữ nghĩa: header, nav, main, section, article, footer","Chèn liên kết, hình ảnh có văn bản thay thế (alt) và danh sách","Kiểm tra lỗi HTML cơ bản và khả năng truy cập"],
  prep:["Đọc Connolly & Hoar (2022), Chương 3.","Đọc mục HTML trên MDN Web Docs: 'Structuring content with HTML'.","Phác thảo trên giấy bố cục trang sản phẩm của Cửa hàng Mẫu."],
  ideas:[
   ["Cấu trúc tài liệu","<!DOCTYPE html>, thẻ html có thuộc tính lang=\"vi\", phần head (title, meta charset, meta viewport, meta description) và phần body chứa nội dung hiển thị."],
   ["HTML ngữ nghĩa","Dùng thẻ đúng ý nghĩa: header, nav, main, article, section, aside, footer. Ngữ nghĩa giúp trình đọc màn hình và công cụ tìm kiếm hiểu trang."],
   ["Tiêu đề","Mỗi trang có một h1 mô tả nội dung chính; h2, h3 theo thứ bậc, không nhảy cấp để trang trí."],
   ["Hình ảnh và liên kết","Mọi ảnh nội dung cần alt mô tả; liên kết dùng văn bản rõ nghĩa ('Xem chính sách đổi trả' thay vì 'bấm vào đây')."]
  ],
  worked:{q:"Tìm 5 lỗi trong đoạn mã: <html><head><title></title></head><body><h3>Túi xách da</h3><img src=\"tui.jpg\"><div>Giá: 850.000đ</div><a href=\"/mua\">Bấm vào đây</a><h1>Cửa hàng Mẫu</h1></body></html>",
    a:["Thiếu <!DOCTYPE html> và thuộc tính lang=\"vi\" trên thẻ html.","Thẻ title rỗng; thiếu meta charset và meta viewport.","Tiêu đề sai thứ bậc: h3 đứng trước h1; tên sản phẩm nên là h1 của trang sản phẩm.","Ảnh thiếu alt, ví dụ alt=\"Túi xách da bò màu nâu\".","Liên kết 'Bấm vào đây' không rõ nghĩa; nên dùng 'Thêm vào giỏ hàng' (và thực tế nên là nút button trong biểu mẫu)."]},
  lab:"L2",
  live:["Sửa lỗi (10 phút): lớp cùng sửa đoạn mã ở Ví dụ mẫu trong Lab L2 đến khi điểm kiểm tra đạt 100.","Nhóm (15 phút): viết khung HTML ngữ nghĩa cho trang sản phẩm.","Phiếu ra lớp: vì sao alt quan trọng với cả người dùng và SEO?"],
  case:{ctx:"Trang sản phẩm thử nghiệm của Cửa hàng Mẫu được dựng bằng các thẻ div lồng nhau, ảnh không có alt và có 3 thẻ h1.", qs:["Những vấn đề nào ảnh hưởng tới khả năng truy cập và SEO?","Viết lại khung trang bằng thẻ ngữ nghĩa.","Đặt văn bản alt cho 3 ảnh: ảnh sản phẩm chính, ảnh chi tiết đường may, logo."]},
  quiz:[
   {q:"Thẻ nào chứa nội dung chính, duy nhất của trang?",o:["<section>","<main>","<aside>","<header>"],a:1,e:"Mỗi trang chỉ có một <main> chứa nội dung chính."},
   {q:"Thuộc tính alt của thẻ img dùng để làm gì?",o:["Tăng kích thước ảnh","Mô tả ảnh cho trình đọc màn hình và khi ảnh không tải được","Tạo liên kết","Đặt màu nền"],a:1,e:"alt là văn bản thay thế, hỗ trợ truy cập và SEO."},
   {q:"Thẻ meta viewport cần thiết để làm gì?",o:["Khai báo bảng mã","Hiển thị đúng trên thiết bị di động","Mô tả trang cho công cụ tìm kiếm","Nạp CSS"],a:1,e:"Viewport giúp trang co giãn theo chiều rộng thiết bị."},
   {q:"Nhận định nào đúng về thẻ tiêu đề?",o:["Dùng h1 cho mọi chữ to","Mỗi trang nên có một h1, các cấp tiếp theo theo thứ bậc","h3 luôn đứng trước h2","Không cần tiêu đề nếu có ảnh"],a:1,e:"Tiêu đề tạo dàn ý cho trang; giữ đúng thứ bậc."}
  ],
  wrap:["Tôi viết được khung HTML đúng chuẩn.","Tôi dùng được thẻ ngữ nghĩa thay cho div.","Tôi kiểm tra được lỗi alt, tiêu đề và liên kết."]
},
{ id:3, week:"Tuần 3", title:"CSS: bộ chọn, màu chữ và mô hình hộp", ch:"Connolly & Hoar Ch4 · Felke-Morris Ch3, Ch4", sub:"Định kiểu trang theo nhận diện thương hiệu", clo:"CLO2",
  goals:["Viết quy tắc CSS với bộ chọn phần tử, lớp, id, thuộc tính và trạng thái","Tính độ ưu tiên (specificity) và giải thích cơ chế cascade","Áp dụng mô hình hộp: content, padding, border, margin, box-sizing","Xây dựng bộ biến CSS cho màu, chữ theo nhận diện thương hiệu"],
  prep:["Đọc Connolly & Hoar (2022), Chương 4.","Đọc mục 'CSS building blocks' trên MDN Web Docs.","Chuẩn bị bảng màu và phông chữ thương hiệu cho website của nhóm."],
  ideas:[
   ["Quy tắc CSS","Bộ chọn { thuộc tính: giá trị; }. Có thể đặt trong tệp .css riêng (khuyến nghị), thẻ style hoặc thuộc tính style."],
   ["Cascade và specificity","Khi nhiều quy tắc cùng áp dụng, quy tắc có độ ưu tiên cao hơn thắng: inline > id > lớp, thuộc tính, trạng thái > phần tử. Cùng mức thì quy tắc viết sau thắng."],
   ["Mô hình hộp","Mỗi phần tử là một hộp gồm nội dung, padding, border, margin. Với box-sizing: border-box, width đã bao gồm padding và border, giúp tính bố cục dễ hơn."],
   ["Biến CSS","Khai báo --mau-chinh: #144e8c; trong :root và dùng var(--mau-chinh). Đổi thương hiệu chỉ cần sửa một chỗ."]
  ],
  worked:{q:"Một thẻ div có width: 300px; padding: 20px; border: 2px solid; margin: 16px. Tính chiều rộng chiếm chỗ trên trang khi box-sizing là content-box và khi là border-box.",
    a:["content-box: hộp hiển thị = 300 + 2×20 + 2×2 = 344px; chiếm chỗ kể cả margin = 344 + 2×16 = 376px.","border-box: hộp hiển thị = 300px (nội dung co lại còn 300 − 40 − 4 = 256px); chiếm chỗ kể cả margin = 332px.","Vì vậy nhiều dự án đặt *, *::before, *::after { box-sizing: border-box; } ngay từ đầu."]},
  lab:"L3",
  live:["Câu đố (5 phút): 3 quy tắc cùng tô màu một nút; lớp đoán màu cuối cùng rồi kiểm tra bằng Lab L3.","Nhóm (20 phút): viết biến CSS màu, chữ của thương hiệu nhóm và áp dụng cho trang sản phẩm.","Phiếu ra lớp: vì sao nên hạn chế dùng id và !important để định kiểu?"],
  case:{ctx:"Cửa hàng Mẫu muốn website dùng màu nâu da và kem làm chủ đạo, nhưng mỗi trang hiện đang viết màu trực tiếp ở nhiều nơi, khó thống nhất.", qs:["Đề xuất bộ biến CSS cho màu và chữ.","Kiểm tra độ tương phản chữ và nền theo khuyến nghị WCAG (tối thiểu 4,5:1 cho chữ thường).","Đặt quy ước đặt tên lớp CSS cho nhóm phát triển."]},
  quiz:[
   {q:"Bộ chọn nào có độ ưu tiên cao nhất?",o:[".nut-mua","#nut-mua","button","button.nut-mua"],a:1,e:"Bộ chọn id có độ ưu tiên (1,0,0), cao hơn lớp và phần tử."},
   {q:"Với box-sizing: border-box, thuộc tính width bao gồm những gì?",o:["Chỉ nội dung","Nội dung, padding và border","Nội dung, padding, border và margin","Chỉ padding"],a:1,e:"border-box tính width gồm cả padding và border, không gồm margin."},
   {q:"Lợi ích chính của biến CSS là gì?",o:["Tải trang nhanh hơn","Quản lý giá trị dùng chung (màu, chữ) tại một chỗ","Thay thế HTML","Tăng bảo mật"],a:1,e:"Biến CSS giúp đồng bộ nhận diện và dễ bảo trì."},
   {q:"Hai quy tắc cùng độ ưu tiên áp dụng cho một phần tử. Quy tắc nào thắng?",o:["Quy tắc viết trước","Quy tắc viết sau","Quy tắc ngắn hơn","Ngẫu nhiên"],a:1,e:"Theo cascade, quy tắc xuất hiện sau thắng khi độ ưu tiên bằng nhau."}
  ],
  wrap:["Tôi tính được độ ưu tiên của bộ chọn.","Tôi tính được kích thước hộp với hai giá trị box-sizing.","Tôi tạo được bộ biến CSS theo thương hiệu."]
},
{ id:4, week:"Tuần 4", title:"Bố cục và thiết kế đáp ứng", ch:"Connolly & Hoar Ch7 · Felke-Morris Ch6, Ch7", sub:"Flexbox, Grid, media query và nguyên tắc ưu tiên di động", clo:"CLO2, CLO3",
  goals:["Dàn trang bằng Flexbox cho một chiều và Grid cho hai chiều","Viết media query theo nguyên tắc ưu tiên di động (mobile first)","Thiết kế lưới sản phẩm tự co giãn theo màn hình","Kiểm tra giao diện trên nhiều kích thước bằng DevTools"],
  prep:["Đọc Connolly & Hoar (2022), Chương 7.","Đọc hướng dẫn Flexbox và Grid trên MDN Web Docs.","Chụp ảnh trang chủ của một website bán hàng ở 3 kích thước: điện thoại, máy tính bảng, máy tính."],
  ideas:[
   ["Flexbox","display: flex; sắp xếp phần tử theo một trục, căn chỉnh bằng justify-content, align-items, gap. Phù hợp thanh menu, hàng nút, thẻ sản phẩm."],
   ["Grid","display: grid; chia cột và hàng. grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) tạo lưới sản phẩm tự co giãn không cần media query."],
   ["Mobile first","Viết CSS cho màn hình nhỏ trước, sau đó dùng @media (min-width: 768px) để bổ sung cho màn hình lớn. Phần lớn lượt truy cập thương mại điện tử đến từ điện thoại."],
   ["Kiểm thử","Dùng chế độ thiết bị (device toolbar) của DevTools; tránh cuộn ngang; vùng chạm tối thiểu khoảng 44 × 44 px cho nút trên di động."]
  ],
  worked:{q:"Lưới sản phẩm cần 1 cột trên điện thoại (< 600px), 2 cột từ 600px, 4 cột từ 1024px. Viết CSS theo nguyên tắc mobile first.",
    a:[".luoi-sp { display: grid; gap: 16px; grid-template-columns: 1fr; }","@media (min-width: 600px) { .luoi-sp { grid-template-columns: repeat(2, 1fr); } }","@media (min-width: 1024px) { .luoi-sp { grid-template-columns: repeat(4, 1fr); } }","Cách thay thế không cần media query: grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));"]},
  lab:"L4",
  live:["Dự đoán (5 phút): ở chiều rộng 800px, lưới sẽ có mấy cột? Kiểm tra bằng Lab L4.","Nhóm (20 phút): dựng bố cục trang chủ đáp ứng cho website của nhóm.","Phiếu ra lớp: khi nào dùng Flexbox, khi nào dùng Grid?"],
  case:{ctx:"Website thử nghiệm của Cửa hàng Mẫu hiển thị 4 cột sản phẩm trên điện thoại, chữ rất nhỏ, khách phải phóng to để bấm nút mua.", qs:["Xác định nguyên nhân kỹ thuật (thiếu viewport, cột cố định, nút nhỏ).","Đề xuất điểm ngắt (breakpoint) và số cột cho từng kích thước.","Lập danh sách kiểm thử giao diện trên di động trước khi ra mắt."]},
  quiz:[
   {q:"Thuộc tính nào tạo lưới tự co giãn không cần media query?",o:["float: left","grid-template-columns: repeat(auto-fill, minmax(220px, 1fr))","display: inline","position: absolute"],a:1,e:"auto-fill kết hợp minmax tự tính số cột theo chiều rộng."},
   {q:"Mobile first nghĩa là viết media query với điều kiện nào?",o:["max-width","min-width","orientation","print"],a:1,e:"Bắt đầu từ màn hình nhỏ, bổ sung bằng min-width cho màn hình lớn hơn."},
   {q:"Flexbox phù hợp nhất cho trường hợp nào?",o:["Bố cục hai chiều phức tạp","Sắp xếp phần tử theo một hàng hoặc một cột","Bảng dữ liệu","Định dạng chữ"],a:1,e:"Flexbox xử lý bố cục một chiều."},
   {q:"Dấu hiệu nào cho thấy trang chưa đáp ứng tốt trên di động?",o:["Có cuộn dọc","Có cuộn ngang","Có menu","Có ảnh"],a:1,e:"Cuộn ngang cho thấy nội dung vượt quá chiều rộng màn hình."}
  ],
  wrap:["Tôi chọn đúng Flexbox hoặc Grid cho từng bố cục.","Tôi viết được media query theo mobile first.","Tôi kiểm thử được giao diện trên nhiều kích thước."]
},
{ id:5, week:"Tuần 5", title:"Bảng, biểu mẫu và thu thập khách hàng tiềm năng", ch:"Connolly & Hoar Ch5 · Felke-Morris Ch8, Ch9", sub:"Biểu mẫu đặt hàng, đăng ký và kiểm tra dữ liệu nhập", clo:"CLO2, CLO3",
  goals:["Tạo biểu mẫu với các kiểu input phù hợp: email, tel, number, select, checkbox","Gắn nhãn (label) và kiểm tra dữ liệu bằng thuộc tính HTML5: required, pattern, min, max","Thiết kế biểu mẫu ngắn, dễ hoàn thành trên di động","Bổ sung nội dung xin đồng ý xử lý dữ liệu cá nhân"],
  prep:["Đọc Connolly & Hoar (2022), Chương 5.","Đọc mục 'Web forms' trên MDN Web Docs.","Thu thập 2 biểu mẫu đăng ký hoặc đặt hàng trên website thật và đếm số trường bắt buộc."],
  ideas:[
   ["Thành phần biểu mẫu","form (action, method), label gắn với input qua for/id, các kiểu input, select, textarea, button type=\"submit\"."],
   ["Kiểm tra dữ liệu","Phía client: required, type=\"email\", pattern, minlength giúp phản hồi nhanh. Phía máy chủ: bắt buộc kiểm tra lại vì dữ liệu phía client có thể bị sửa."],
   ["Tối ưu biểu mẫu","Chỉ hỏi thông tin cần thiết; dùng đúng kiểu input để điện thoại hiện bàn phím phù hợp; thông báo lỗi cụ thể, ngay cạnh trường bị lỗi."],
   ["Dữ liệu cá nhân","Biểu mẫu thu thập họ tên, số điện thoại, email cần nêu mục đích và có lựa chọn đồng ý riêng cho việc nhận thông tin quảng cáo, phù hợp Luật Bảo vệ dữ liệu cá nhân 2025."]
  ],
  worked:{q:"Biểu mẫu đăng ký nhận ưu đãi hiện có 9 trường: họ, tên, ngày sinh, giới tính, email, điện thoại, địa chỉ, nghề nghiệp, thu nhập. Đề xuất phiên bản rút gọn và viết mã cho trường điện thoại Việt Nam 10 số bắt đầu bằng 0.",
    a:["Giữ: họ tên, email hoặc điện thoại (một trong hai), ô đồng ý nhận ưu đãi. Bỏ các trường chưa dùng cho mục tiêu nhận ưu đãi.","Mã: <label for=\"sdt\">Số điện thoại</label> <input id=\"sdt\" name=\"sdt\" type=\"tel\" pattern=\"0[0-9]{9}\" required>","type=\"tel\" mở bàn phím số trên điện thoại; pattern kiểm tra đúng 10 chữ số bắt đầu bằng 0.","Máy chủ vẫn phải kiểm tra lại dữ liệu trước khi lưu."]},
  lab:"L5",
  live:["Thử nghiệm (10 phút): sinh viên điền biểu mẫu trong Lab L5 bằng điện thoại, ghi lại lỗi gặp phải.","Nhóm (15 phút): thiết kế biểu mẫu đặt hàng tối giản cho website nhóm.","Phiếu ra lớp: vì sao không thể chỉ dựa vào kiểm tra phía client?"],
  case:{ctx:"Cửa hàng Mẫu chạy quảng cáo dẫn về trang đăng ký nhận mã giảm giá. Nhiều khách bấm vào nhưng ít người hoàn thành biểu mẫu 9 trường.", qs:["Những trường nào có thể bỏ hoặc để sau?","Thiết kế thông báo lỗi và ô đồng ý dữ liệu cá nhân.","Đo hiệu quả biểu mẫu bằng chỉ số nào?"]},
  quiz:[
   {q:"Kiểu input nào mở bàn phím số điện thoại trên di động?",o:["text","tel","email","search"],a:1,e:"type=\"tel\" gợi ý bàn phím số điện thoại."},
   {q:"Thuộc tính nào bắt buộc người dùng nhập trường?",o:["pattern","required","placeholder","value"],a:1,e:"required ngăn gửi biểu mẫu khi trường trống."},
   {q:"Vì sao mỗi input cần một label gắn qua for/id?",o:["Để trang đẹp hơn","Để trình đọc màn hình đọc đúng và bấm vào nhãn sẽ chọn ô nhập","Để tăng tốc tải","Để mã hóa dữ liệu"],a:1,e:"Label cải thiện khả năng truy cập và vùng bấm."},
   {q:"Kiểm tra dữ liệu phía máy chủ cần thiết vì sao?",o:["Trình duyệt không hỗ trợ HTML5","Dữ liệu phía client có thể bị sửa hoặc bỏ qua","Để giảm dung lượng","Không cần thiết"],a:1,e:"Người dùng có thể vô hiệu hóa kiểm tra phía client; máy chủ phải tự kiểm tra."}
  ],
  wrap:["Tôi chọn đúng kiểu input cho từng loại dữ liệu.","Tôi viết được quy tắc kiểm tra bằng HTML5.","Tôi thiết kế được biểu mẫu ngắn, có xin đồng ý dữ liệu cá nhân."]
},
{ id:6, week:"Tuần 6", title:"JavaScript: nền tảng ngôn ngữ và DOM", ch:"Connolly & Hoar Ch8–9 · Felke-Morris Ch14", sub:"Biến, hàm, mảng, đối tượng, sự kiện và thao tác DOM", clo:"CLO2, CLO3",
  goals:["Sử dụng biến, hàm, mảng, đối tượng trong JavaScript","Dùng các phương thức mảng filter, map, reduce, sort để xử lý danh sách sản phẩm","Bắt sự kiện và cập nhật DOM","Gỡ lỗi bằng console và DevTools"],
  prep:["Đọc Connolly & Hoar (2022), Chương 8 và 9.","Ôn lại kiến thức học phần Tư duy lập trình: biến, điều kiện, vòng lặp, hàm.","Đọc mục 'JavaScript first steps' trên MDN Web Docs."],
  ideas:[
   ["Kiểu dữ liệu","Số, chuỗi, boolean, mảng, đối tượng. Danh sách sản phẩm thường là mảng các đối tượng: [{ ten, gia, danhMuc }]."],
   ["Phương thức mảng","filter lọc theo điều kiện; map biến đổi từng phần tử; reduce gộp thành một giá trị (tổng tiền); sort sắp xếp."],
   ["DOM","Trình duyệt biểu diễn trang thành cây đối tượng. document.querySelector chọn phần tử; textContent, classList, append để cập nhật."],
   ["Sự kiện","element.addEventListener('click', hamXuLy). Các sự kiện thường gặp: click, input, change, submit."]
  ],
  worked:{q:"Cho mảng sp = [{ten:'Túi tote', gia:450000}, {ten:'Ví da', gia:320000}, {ten:'Balo', gia:980000}]. Viết biểu thức: (a) lọc sản phẩm dưới 500.000 đồng; (b) tạo mảng tên; (c) tính tổng giá.",
    a:["(a) sp.filter(p => p.gia < 500000) → Túi tote, Ví da.","(b) sp.map(p => p.ten) → ['Túi tote', 'Ví da', 'Balo'].","(c) sp.reduce((tong, p) => tong + p.gia, 0) → 1.750.000.","Chạy thử từng biểu thức trong Lab L6 để kiểm tra kết quả."]},
  lab:"L6",
  live:["Lập trình đôi (15 phút): giải 4 bài trong Lab L6, đổi vai người gõ sau mỗi bài.","Trình bày (10 phút): 2 nhóm giải thích lời giải bài reduce.","Phiếu ra lớp: khác nhau giữa map và filter."],
  case:{ctx:"Trang danh mục của Cửa hàng Mẫu có 60 sản phẩm; khách muốn lọc theo khoảng giá và sắp xếp theo giá tăng dần mà không tải lại trang.", qs:["Viết hàm lọc theo khoảng giá và danh mục.","Viết hàm sắp xếp và hiển thị lại danh sách.","Khi số sản phẩm lên 5.000, nên xử lý lọc ở trình duyệt hay máy chủ? Vì sao?"]},
  quiz:[
   {q:"Phương thức nào trả về mảng mới chỉ gồm phần tử thỏa điều kiện?",o:["map","filter","reduce","forEach"],a:1,e:"filter giữ lại phần tử thỏa điều kiện."},
   {q:"[1, 2, 3].map(x => x * 2) cho kết quả nào?",o:["[1, 2, 3]","[2, 4, 6]","6","12"],a:1,e:"map nhân đôi từng phần tử."},
   {q:"Lệnh nào chọn phần tử đầu tiên có lớp .gio-hang?",o:["document.getElement('.gio-hang')","document.querySelector('.gio-hang')","document.class('gio-hang')","window.find('.gio-hang')"],a:1,e:"querySelector nhận bộ chọn CSS."},
   {q:"Sự kiện nào phù hợp để cập nhật kết quả lọc ngay khi người dùng gõ?",o:["submit","input","load","unload"],a:1,e:"input kích hoạt mỗi khi giá trị ô nhập thay đổi."}
  ],
  wrap:["Tôi dùng được filter, map, reduce, sort.","Tôi bắt được sự kiện và cập nhật DOM.","Tôi gỡ lỗi được bằng console."]
},
{ id:7, week:"Tuần 7", title:"Dữ liệu JSON, Fetch API và giỏ hàng", ch:"Connolly & Hoar Ch10, Ch15", sub:"Trao đổi dữ liệu với máy chủ và quản lý trạng thái giỏ hàng", clo:"CLO3",
  goals:["Đọc và viết dữ liệu JSON","Gọi API bằng fetch, xử lý bất đồng bộ với async/await","Quản lý trạng thái giỏ hàng: thêm, sửa số lượng, xóa, tính tổng","Lưu trạng thái phía trình duyệt bằng localStorage và nhận biết giới hạn"],
  prep:["Đọc Connolly & Hoar (2022), Chương 10 và 15.","Đọc mục 'Fetching data from the server' trên MDN Web Docs.","Xem cấu trúc JSON trả về từ một API công khai bằng trình duyệt."],
  ideas:[
   ["JSON","Định dạng văn bản biểu diễn đối tượng và mảng: {\"ten\": \"Ví da\", \"gia\": 320000}. JSON.parse chuyển chuỗi thành đối tượng; JSON.stringify làm ngược lại."],
   ["Fetch API","const res = await fetch('/api/san-pham'); const data = await res.json(); Cần kiểm tra res.ok và bắt lỗi bằng try/catch."],
   ["Trạng thái","Giỏ hàng là trạng thái (state) của ứng dụng: danh sách sản phẩm và số lượng. Giao diện được vẽ lại từ trạng thái mỗi khi trạng thái thay đổi."],
   ["Lưu trữ","localStorage lưu dữ liệu nhỏ trên trình duyệt của người dùng; giỏ hàng đã đặt và giá bán phải xác nhận lại ở máy chủ. Học phần Phát triển web kinh doanh nâng cao (BIE5061) mở rộng với Angular, Node.js và MongoDB."]
  ],
  worked:{q:"Giỏ hàng có: Túi tote 450.000 đồng × 2, Ví da 320.000 đồng × 1. Mã giảm 10% cho đơn từ 1.000.000 đồng; phí giao hàng 30.000 đồng, miễn phí cho đơn sau giảm từ 1.000.000 đồng. Tính tổng thanh toán và viết trạng thái giỏ hàng dạng JSON.",
    a:["Tạm tính = 450.000 × 2 + 320.000 = 1.220.000 đồng ≥ 1.000.000 nên được giảm 10% = 122.000 đồng.","Sau giảm = 1.098.000 đồng ≥ 1.000.000 nên miễn phí giao hàng. Tổng thanh toán = 1.098.000 đồng.","JSON: {\"items\":[{\"id\":\"tote\",\"gia\":450000,\"sl\":2},{\"id\":\"vi\",\"gia\":320000,\"sl\":1}],\"ma\":\"GIAM10\"}","Kiểm tra lại bằng Lab L7."]},
  lab:"L7",
  live:["Mô phỏng (10 phút): một sinh viên đóng vai máy chủ trả JSON, lớp viết lệnh fetch và xử lý kết quả.","Nhóm (15 phút): bổ sung quy tắc mã giảm giá mới cho giỏ hàng trong Lab L7 và kiểm thử các trường hợp biên.","Phiếu ra lớp: vì sao không tin giá sản phẩm gửi lên từ trình duyệt?"],
  case:{ctx:"Khách của Cửa hàng Mẫu phản ánh giỏ hàng bị mất khi tải lại trang, và một khách sửa giá trong DevTools rồi đặt hàng với giá thấp.", qs:["Giải pháp lưu giỏ hàng giữa các lần tải trang là gì?","Lỗ hổng sửa giá xuất phát từ đâu? Máy chủ phải xử lý thế nào?","Lập danh sách trường hợp kiểm thử cho giỏ hàng."]},
  quiz:[
   {q:"JSON.parse dùng để làm gì?",o:["Chuyển đối tượng thành chuỗi","Chuyển chuỗi JSON thành đối tượng","Gửi dữ liệu lên máy chủ","Mã hóa dữ liệu"],a:1,e:"parse đọc chuỗi JSON thành giá trị JavaScript."},
   {q:"Vì sao cần await khi gọi fetch?",o:["fetch trả về Promise, kết quả có sau khi mạng phản hồi","Để tăng tốc","Để mã hóa","Không cần"],a:0,e:"fetch là thao tác bất đồng bộ."},
   {q:"Giá cuối cùng của đơn hàng nên được tính ở đâu?",o:["Chỉ trên trình duyệt","Trên máy chủ, dựa vào dữ liệu giá của hệ thống","Trong localStorage","Trong URL"],a:1,e:"Dữ liệu từ trình duyệt có thể bị sửa; máy chủ phải tính lại."},
   {q:"localStorage có đặc điểm nào?",o:["Chia sẻ giữa mọi thiết bị","Lưu trên trình duyệt của người dùng, dung lượng nhỏ","Bảo mật tuyệt đối","Lưu trên máy chủ"],a:1,e:"localStorage chỉ tồn tại trên trình duyệt đó."}
  ],
  wrap:["Tôi đọc và viết được JSON.","Tôi gọi được API bằng fetch và xử lý lỗi.","Tôi quản lý được trạng thái giỏ hàng."]
},
{ id:8, week:"Tuần 8", title:"Trải nghiệm người dùng và tối ưu chuyển đổi", ch:"Felke-Morris Ch5 · Krug (2014)", sub:"Nguyên tắc thiết kế, khả năng truy cập, trang đích và thử nghiệm A/B", clo:"CLO3, CLO4",
  goals:["Áp dụng nguyên tắc thiết kế: phân cấp thị giác, nhất quán, tương phản, khoảng trắng","Đánh giá khả năng truy cập theo các tiêu chí cơ bản của WCAG 2.2","Thiết kế trang đích (landing page) có lời kêu gọi hành động rõ ràng","Đọc kết quả thử nghiệm A/B và kiểm định ý nghĩa thống kê"],
  prep:["Đọc Felke-Morris (2021), Chương 5 (Web Design).","Đọc Krug (2014), các chương về 'đừng bắt người dùng phải nghĩ'.","Chọn 1 trang đích quảng cáo và ghi lại 3 điểm làm bạn do dự khi định đăng ký hoặc mua."],
  ideas:[
   ["Nguyên tắc thiết kế","Phân cấp thị giác dẫn mắt người xem tới nội dung quan trọng; nhất quán giữa các trang; tương phản đủ để đọc; khoảng trắng tách nhóm thông tin."],
   ["Khả năng truy cập","WCAG 2.2: văn bản thay thế cho ảnh, tương phản tối thiểu 4,5:1, thao tác được bằng bàn phím, nhãn rõ cho biểu mẫu, không dùng màu là tín hiệu duy nhất."],
   ["Trang đích","Một mục tiêu, một lời kêu gọi hành động nổi bật; tiêu đề nêu lợi ích; bằng chứng tin cậy (đánh giá thật, chính sách đổi trả); biểu mẫu ngắn."],
   ["Thử nghiệm A/B","Chia ngẫu nhiên lưu lượng cho 2 phiên bản, so sánh tỷ lệ chuyển đổi. Cần đủ cỡ mẫu và kiểm định ý nghĩa thống kê trước khi kết luận."]
  ],
  worked:{q:"Phiên bản A: 4.000 lượt truy cập, 120 đơn. Phiên bản B: 4.000 lượt truy cập, 156 đơn. Tính tỷ lệ chuyển đổi, mức tăng tương đối và kiểm định z hai tỷ lệ.",
    a:["A: 120 / 4.000 = 3,0%; B: 156 / 4.000 = 3,9%; mức tăng tương đối = 30%.","Tỷ lệ gộp p = 276 / 8.000 = 3,45%; sai số chuẩn = √(p(1 − p)(1/4.000 + 1/4.000)) ≈ 0,00408.","z = (0,039 − 0,030) / 0,00408 ≈ 2,2; giá trị p hai phía ≈ 0,028 < 0,05.","Kết luận: B tốt hơn A có ý nghĩa thống kê ở mức 5%. Kiểm tra lại bằng Lab L8."]},
  lab:"L8",
  live:["Đánh giá chéo (15 phút): các nhóm dùng danh mục trong Lab L8 chấm trang đích của nhóm khác.","Thảo luận (10 phút): thử nghiệm chạy 2 ngày đã thấy B tốt hơn, có nên dừng sớm không?","Phiếu ra lớp: một thay đổi giúp trang đích của nhóm dễ dùng hơn."],
  case:{ctx:"Cửa hàng Mẫu thử 2 phiên bản nút mua: 'Mua ngay' màu xám và 'Thêm vào giỏ – Giao 2 giờ' màu cam. Sau 3 ngày, phiên bản cam có thêm 8 đơn.", qs:["Dữ liệu đã đủ để kết luận chưa? Dùng Lab L8 để kiểm tra.","Cần bao nhiêu lượt truy cập để phát hiện mức tăng 20%?","Ngoài màu nút, nên thử nghiệm yếu tố nào trên trang sản phẩm?"]},
  quiz:[
   {q:"Tỷ lệ tương phản tối thiểu cho văn bản thường theo WCAG mức AA là bao nhiêu?",o:["2:1","3:1","4,5:1","7:1"],a:2,e:"Mức AA yêu cầu 4,5:1 cho văn bản thường."},
   {q:"Nguyên tắc nào quan trọng nhất cho trang đích quảng cáo?",o:["Nhiều liên kết ra ngoài","Một mục tiêu và một lời kêu gọi hành động rõ ràng","Nhiều hiệu ứng động","Menu đầy đủ mọi danh mục"],a:1,e:"Trang đích tập trung vào một hành động chuyển đổi."},
   {q:"Giá trị p = 0,28 trong thử nghiệm A/B có nghĩa là gì?",o:["B chắc chắn tốt hơn","Chưa đủ bằng chứng kết luận hai phiên bản khác nhau","A tốt hơn 28%","Thử nghiệm lỗi"],a:1,e:"p lớn hơn 0,05: chưa bác bỏ giả thuyết hai tỷ lệ bằng nhau."},
   {q:"Dùng màu đỏ là cách duy nhất báo lỗi biểu mẫu vi phạm nguyên tắc nào?",o:["Tốc độ tải","Không dùng màu là tín hiệu duy nhất","Bảo mật","SEO"],a:1,e:"Người mù màu có thể không nhận ra; cần thêm biểu tượng hoặc chữ."}
  ],
  wrap:["Tôi đánh giá được một trang theo nguyên tắc thiết kế và truy cập.","Tôi thiết kế được trang đích một mục tiêu.","Tôi đọc được kết quả thử nghiệm A/B."]

const $ = (s, r=document) => r.querySelector(s);
const h = (tag, attrs={}, html="") => { const e=document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); e.innerHTML=html; return e; };
const nf = (x, d=0) => (isFinite(x) ? x : 0).toLocaleString("vi-VN", {maximumFractionDigits:d, minimumFractionDigits:d});
const vnd = x => nf(Math.round(x)) + " đ";
const pct = (x, d=1) => nf(x*100, d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = COURSE.key;
let store = {done:{}, present:false};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.done) store = Object.assign(store, s); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
function progress(){
  const total = MODULES.length * ITEMS.length;
  const n = Object.keys(store.done).filter(k => store.done[k]).length;
  const p = Math.round(n/total*100);
  $("#pbar").style.width = p + "%"; $("#ptxt").textContent = p + "%";
}
function modPct(m){ return ITEMS.filter(it => store.done["m"+m.id+"-"+it.k]).length / ITEMS.length; }
function ring(p){
  const c = 2*Math.PI*16, off = c*(1-p);
  return `<svg class="ring" viewBox="0 0 40 40" aria-label="${Math.round(p*100)}% hoàn thành"><circle cx="20" cy="20" r="16" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="var(--orange)" stroke-width="4" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 20 20)" stroke-linecap="round"/><text x="20" y="24" text-anchor="middle" font-size="10" fill="var(--fg)" font-family="Roboto Mono">${Math.round(p*100)}%</text></svg>`;
}
function slider(id, label, min, max, step, val, fmt){
  return `<div class="ctrl"><label for="${id}">${label}<b id="${id}-v"></b></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-fmt="${fmt||""}"></div>`;
}
function bindSliders(root, cb){
  const upd = () => { root.querySelectorAll("input[type=range]").forEach(r => {
      const f = r.dataset.fmt, v = +r.value; const o = $("#"+r.id+"-v", root);
      if (o) o.textContent = f==="vnd" ? vnd(v) : f==="pct" ? nf(v,1)+"%" : f==="pct2" ? nf(v,2)+"%" : f==="ms" ? v+" ms" : f==="mb" ? nf(v,1)+" MB" : f==="mbps" ? v+" Mbps" : nf(v);
    }); cb(); };
  root.querySelectorAll("input,select,textarea").forEach(i => i.addEventListener("input", upd));
  upd();
}
const val = (root, id) => +$("#"+id, root).value;

function labBlock(id){
  const L=LABS[id]; const box=h("section",{class:"lab",id:"lab-"+L.k});
  box.innerHTML=`<div class="lab-h"><h3>${L.title}</h3><span class="k">Lab ${id.slice(1)} · Module ${L.m}</span></div><div data-body></div>`;
  L.render(box.querySelector("[data-body]")); return box;
}

// ===== QUIZ =====
function quizBlock(qs, onDone){
  const wrap=h("div",{class:"view"}); let answered=0, right=0;
  qs.forEach((q,qi)=>{
    const d=h("div",{class:"q card"}, `<b>Câu ${qi+1}. ${q.q}</b><div class="opts">${q.o.map((o,i)=>`<button type="button" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><p class="ex" hidden></p>`);
    d.querySelector(".opts").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b||d.dataset.done) return; d.dataset.done=1; answered++;
      const i=+b.dataset.i; if(i===q.a) right++;
      d.querySelectorAll(".opts button").forEach(x=>{ if(+x.dataset.i===q.a) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
      const ex=d.querySelector(".ex"); ex.hidden=false; ex.innerHTML=(i===q.a?"<b>Chính xác.</b> ":"<b>Chưa đúng.</b> ")+q.e;
      if(answered===qs.length && onDone) onDone(right, qs.length); });
    wrap.appendChild(d);
  });
  return wrap;
}

function moduleView(id, itemKey){
  const m=MODULES[id-1]; const it=ITEMS.find(i=>i.k===itemKey)||ITEMS[0]; const idx=ITEMS.indexOf(it);

  d.innerHTML=`<aside class="side"><nav class="mnav" aria-label="Chọn module">${MODULES.map(x=>`<a href="#m${x.id}" class="${x.id===id?"on":""}">M${x.id}</a>`).join("")}</nav>
   <div><div class="eyebrow" style="color:var(--muted)">Module ${m.id} · ${m.week}</div><h3 style="margin-top:4px">${m.title}</h3><p class="note" style="margin-top:4px">${pct(modPct(m),0)} hoàn thành</p></div>
   <div class="items">${ITEMS.map(x=>`<button type="button" data-k="${x.k}" class="${x.k===it.k?"on":""}"><span>${x.k==="case"?"Tình huống "+CASE:x.t}<small>${x.s}</small></span><span class="dot ${store.done["m"+id+"-"+x.k]?"done":""}"></span></button>`).join("")}</div></aside>
   <article class="content" id="ct"></article>`;
  d.querySelector(".items").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) location.hash=`m${id}-${b.dataset.k}`; });
  const ct=d.querySelector("#ct");
  ct.innerHTML=`<div class="kicker">Module ${m.id} · ${it.s}</div><h2>${it.k==="overview"?m.title:it.t}</h2>`;
  const body=h("div",{class:"prose"});
  if(it.k==="overview"){
    body.innerHTML=`<p class="lead">${m.sub}.</p><div class="grid2" style="max-width:none"><div class="card"><h4 class="eyebrow" style="color:var(--muted)">Sau module này, bạn có thể</h4><ul style="margin-top:8px">${m.goals.map(g=>`<li>${g}</li>`).join("")}</ul></div><div class="card"><dl class="kv"><dt>Thời gian</dt><dd>${m.week}</dd><dt>Giáo trình</dt><dd>${m.ch}</dd><dt>Chuẩn đầu ra</dt><dd>${m.clo}</dd><dt>Lab</dt><dd>${LABS[m.lab].title}</dd><dt>Luyện tập</dt><dd>1 ví dụ mẫu, ${m.quiz.length} câu hỏi</dd></dl></div></div>`;
    if(m.demoHtml){ body.innerHTML+=m.demoHtml; }
    body.innerHTML+=`<p class="note">Làm lần lượt các mục ở cột trái. Bấm nút cam cuối mỗi mục để đánh dấu hoàn thành; tiến độ chỉ lưu trong trình duyệt này.</p>`;
  } else if(it.k==="prep"){ body.innerHTML=`<ol>${m.prep.map(p=>`<li>${p}</li>`).join("")}</ol><div class="callout">Ghi chép câu hỏi phát sinh khi đọc để nêu trong phần hỏi – đáp trên lớp.</div>`;
  } else if(it.k==="ideas"){ body.innerHTML=m.ideas.map(i=>`<section style="display:grid;gap:4px"><h4 style="font-size:17px">${i[0]}</h4><p>${i[1]}</p></section>`).join("");
  } else if(it.k==="worked"){ body.innerHTML=`<div class="card"><p>${m.worked.q}</p></div><div class="callout or">Tự giải trên giấy trước, sau đó mới mở lời giải.</div><button class="btn ghost" type="button" id="showsol" style="justify-self:start">Xem lời giải</button><ol id="sol" hidden>${m.worked.a.map(a=>`<li>${a}</li>`).join("")}</ol>`;
    setTimeout(()=>{ const b=$("#showsol",ct); if(b) b.onclick=()=>{ $("#sol",ct).hidden=false; b.hidden=true; }; });
  } else if(it.k==="lab"){ body.style.maxWidth="none"; body.appendChild(labBlock(m.lab));
  } else if(it.k==="live"){ body.innerHTML=`<ol>${m.live.map(p=>`<li>${p}</li>`).join("")}</ol><div class="row"><a class="btn ghost" href="#tools">Mở công cụ lớp học</a></div>`;
  } else if(it.k==="quiz"){ body.appendChild(quizBlock(m.quiz,(r,n)=>{ const p=h("p",{class:"callout"},`Kết quả: ${r}/${n} câu đúng.`); body.appendChild(p); }));
  } else if(it.k==="case"){ body.innerHTML=`<div class="card"><p><b>Bối cảnh.</b> ${m.case.ctx}</p></div><h4>Câu hỏi thảo luận</h4><ol>${m.case.qs.map(q=>`<li>${q}</li>`).join("")}</ol><p class="note">Dữ liệu về ${CASE} là giả định.</p>`;
  } else if(it.k==="wrap"){ body.innerHTML=`<p>Tự đánh giá mức tự tin với từng nhận định (1 = chưa tự tin, 5 = rất tự tin):</p>${m.wrap.map((w,i)=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0"><span style="flex:1;min-width:200px">${w}</span><span class="seg" data-conf="${i}">${[1,2,3,4,5].map(v=>`<button type="button" class="${(store["conf"+id+"_"+i]===v)?"on":""}" data-v="${v}">${v}</button>`).join("")}</span></div>`).join("")}<div class="callout">Nhận định nào dưới 3 điểm: quay lại mục Ý chính và Ví dụ mẫu, hoặc hỏi giảng viên ở buổi sau.</div>`;
    setTimeout(()=>ct.querySelectorAll("[data-conf]").forEach(s=>s.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; store["conf"+id+"_"+s.dataset.conf]=+b.dataset.v; save(); s.querySelectorAll("button").forEach(x=>x.className=x===b?"on":""); })));

  ct.appendChild(foot);
  setTimeout(()=>{
    $("#done",ct).onclick=()=>{ store.done[key]=true; save(); progress(); location.hash = next?`m${id}-${next.k}`:(id<MODULES.length?`m${id+1}`:"modules"); };

  return d;
}

function togglePresent(force){ store.present = force===undefined ? !store.present : force; document.body.classList.toggle("present",store.present); $("#presentBtn").setAttribute("aria-pressed",store.present); save(); }
$("#presentBtn").onclick=()=>togglePresent();

function route(){
  const raw=(location.hash||"#home").slice(1); const app=$("#app"); app.innerHTML="";
  let mm=raw.match(/^m(\d+)(?:-([a-z]+))?$/);
  renderTabs(raw);
  if(mm && +mm[1]>=1 && +mm[1]<=MODULES.length){ app.appendChild(moduleView(+mm[1], mm[2]||"overview")); }
  else { const f=V[raw]||V.home; const out=f(); const wrap=h("div",{class:"view"}); if(typeof out==="string") wrap.innerHTML=out; else wrap.appendChild(out); app.appendChild(wrap); }
  window.scrollTo(0,0); progress();
}
window.addEventListener("hashchange",route);
function start(){ togglePresent(!!store.present); route(); }

L9:{m:9, title:"Xem trước kết quả tìm kiếm và Core Web Vitals", k:"seo", render(el){
  el.innerHTML=`<div class="grid2" style="grid-template-columns:1fr 1fr"><div style="display:grid;gap:10px">

   <div class="ctrl"><label for="l9d">Meta description <b data-dc></b></label><textarea id="l9d" rows="3">Túi tote da bò thật, may thủ công, ngăn đựng laptop 14 inch. Bảo hành đường may 12 tháng, giao nhanh 2 giờ tại TP.HCM. Đặt hàng ngay.</textarea></div></div>
   <div><h4>Bản xem trước trên kết quả tìm kiếm</h4><div class="serp" data-serp></div><ul class="checks" data-sc></ul></div></div>

  <div class="ctrls">${slider("l9l","LCP (giây)",0.5,8,0.1,3.4)}${slider("l9i","INP (ms)",50,800,10,180)}${slider("l9c","CLS",0,0.5,0.01,0.08)}</div>
  <div class="stats" data-cwv></div><div class="callout or" data-ins></div>
  ${codeBox('<script type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@type": "Product",\n  "name": "Túi tote da bò thủ công màu nâu",\n  "image": "https://cuahangmau.vn/img/tui-tote.webp",\n  "offers": {\n    "@type": "Offer",\n    "price": "450000",\n    "priceCurrency": "VND",\n    "availability": "https://schema.org/InStock"\n  }\n}\n<\/script>',"Dữ liệu có cấu trúc schema.org/Product")}`;
  bindSliders(el,()=>{ const t=$("#l9t",el).value, d=$("#l9d",el).value, slug=slugify($("#l9n",el).value);
    const tl=[...t].length, dl=[...d].length; el.querySelector("[data-tc]").textContent=tl+" ký tự"; el.querySelector("[data-dc]").textContent=dl+" ký tự";
    const cut=(s,n)=>[...s].length>n?[...s].slice(0,n).join("")+"…":s;
    el.querySelector("[data-serp]").innerHTML=`<div class="su">cuahangmau.vn › ${esc(slug)}</div><div class="stt">${esc(cut(t,60))}</div><div class="sd">${esc(cut(d,160))}</div>`;
    const C=[["Title 30–60 ký tự",tl>=30&&tl<=60],["Meta description 70–160 ký tự",dl>=70&&dl<=160],["Title chứa tên thương hiệu",/cửa hàng mẫu/i.test(t)],["Slug không dấu, ngắn (≤ 60 ký tự)",slug.length>0&&slug.length<=60],["Mô tả có lời kêu gọi hành động",/(đặt|mua|xem|nhận|đăng ký)/i.test(d)]];
    el.querySelector("[data-sc]").innerHTML=C.map(c=>`<li><span class="badge ${c[1]?"ok":"bad"}">${c[1]?"Đạt":"Chưa đạt"}</span> ${c[0]}</li>`).join("")+`<li class="note">Slug: /${esc(slug)}</li>`;
    const lv=(v,g,p)=>v<=g?["ok","Tốt"]:v<=p?["warn","Cần cải thiện"]:["bad","Kém"];
    const L=val(el,"l9l"),I=val(el,"l9i"),S=val(el,"l9c"), a=lv(L,2.5,4), b=lv(I,200,500), c=lv(S,0.1,0.25);
    el.querySelector("[data-cwv]").innerHTML=[["LCP",nf(L,1)+" s",a,"≤ 2,5 s"],["INP",I+" ms",b,"≤ 200 ms"],["CLS",nf(S,2),c,"≤ 0,1"]].map(x=>`<div class="stat"><span>${x[0]} (tốt khi ${x[3]})</span><b>${x[1]}</b> <span class="badge ${x[2][0]}">${x[2][1]}</span></div>`).join("");
    const tips=[]; if(a[0]!=="ok") tips.push("LCP: nén ảnh chính, dùng WebP hoặc AVIF, đặt kích thước ảnh, ưu tiên tải ảnh đầu trang, dùng CDN."); if(b[0]!=="ok") tips.push("INP: giảm JavaScript chạy khi tương tác, chia nhỏ tác vụ dài, trì hoãn mã bên thứ ba."); if(c[0]!=="ok") tips.push("CLS: khai báo width, height cho ảnh và khung quảng cáo, tránh chèn nội dung phía trên nội dung đã hiển thị.");
    el.querySelector("[data-ins]").textContent=tips.length?tips.join(" "):"Cả 3 chỉ số đạt ngưỡng tốt."; });
}},
L10:{m:10, title:"Mô phỏng lỗ hổng XSS, SQL injection và kiểm tra triển khai", k:"bao-mat", render(el){
  const ck=["Toàn bộ trang chạy HTTPS, có chuyển hướng từ HTTP","Mật khẩu quản trị mạnh, bật xác thực hai yếu tố","Mã hóa đầu ra khi hiển thị nội dung người dùng","Truy vấn cơ sở dữ liệu dùng tham số hóa","Kiểm tra dữ liệu đầu vào ở máy chủ","Cập nhật phiên bản Node.js, thư viện, CMS","Sao lưu theo quy tắc 3-2-1 và đã thử khôi phục","Có môi trường thử nghiệm (staging) trước khi triển khai","Giám sát thời gian hoạt động và nhật ký lỗi","Có chính sách bảo vệ dữ liệu cá nhân công bố trên website"];
  el.innerHTML=`<p class="predict">Nhập nội dung bình luận hoặc từ khóa tìm kiếm, kể cả nội dung độc hại, để thấy khác biệt giữa cách xử lý không an toàn và an toàn. Mô phỏng chạy trong khung cách ly, mã script không được thực thi.</p>
  <h4>XSS: hiển thị bình luận của khách</h4>
  <div class="ctrl"><label for="l10x">Bình luận</label><input type="text" id="l10x" class="mono" value='Túi đẹp! <b>Sẽ mua lại</b> <img src=x onerror="alert(1)">'></div>
  <div class="grid2" style="grid-template-columns:1fr 1fr"><div><p class="note">Không an toàn: innerHTML</p><iframe class="pv sm" sandbox="" title="Hiển thị không an toàn" data-un></iframe></div><div><p class="note">An toàn: textContent</p><div class="pv sm safe" data-sf></div></div></div>
  <div class="callout" data-xi></div>
  <h4>SQL injection: ô tìm kiếm sản phẩm</h4>
  <div class="ctrl"><label for="l10q">Từ khóa</label><input type="text" id="l10q" class="mono" value="túi' OR '1'='1"></div>
  <pre class="out" data-sq></pre><div class="callout" data-qi></div>
  <h4>Danh mục kiểm tra trước khi triển khai</h4><div class="sortq">${ck.map((c,i)=>`<label class="it"><span><input type="checkbox" id="l10k${i}"> ${c}</span><span></span></label>`).join("")}</div><div class="stats" data-ck></div>
  ${codeBox("// Máy chủ Express tối giản với truy vấn tham số hóa (mysql2)\nconst express = require('express');\nconst mysql = require('mysql2/promise');\nconst app = express();\nconst db = mysql.createPool({ host: 'localhost', user: 'shop_read', database: 'cuahangmau' });\napp.get('/api/san-pham', async (req, res) => {\n  const q = String(req.query.q || '').slice(0, 50);\n  const [rows] = await db.query('SELECT id, ten, gia FROM san_pham WHERE ten LIKE ?', ['%' + q + '%']);\n  res.json(rows);\n});\napp.listen(3000);","Mã tham khảo Node.js, Express")}`;
  bindSliders(el,()=>{ const x=$("#l10x",el).value; el.querySelector("[data-un]").srcdoc=`<body style="font:15px system-ui;margin:8px">${x}</body>`; el.querySelector("[data-sf]").textContent=x;
    const danger=/<script|on\w+\s*=|javascript:/i.test(x);

    const q=$("#l10q",el).value; el.querySelector("[data-sq]").textContent=`Không an toàn (ghép chuỗi):\nSELECT * FROM san_pham WHERE ten LIKE '%${q}%'\n\nAn toàn (tham số hóa):\nSELECT * FROM san_pham WHERE ten LIKE ?\nTham số: ['%${q}%']`;
    el.querySelector("[data-qi]").innerHTML=/'/.test(q)?`<span class="badge bad">Dấu nháy đơn làm thay đổi cấu trúc câu lệnh</span> Ở câu ghép chuỗi, phần sau dấu nháy được hiểu là lệnh SQL. Ở câu tham số hóa, toàn bộ từ khóa chỉ là dữ liệu.`:"Từ khóa không chứa ký tự đặc biệt. Vẫn luôn dùng truy vấn tham số hóa.";
    const k=ck.filter((c,i)=>$("#l10k"+i,el).checked).length; el.querySelector("[data-ck]").innerHTML=`<div class="stat hi"><span>Mức sẵn sàng</span><b>${k}/10</b></div><div class="stat"><span>Đánh giá</span><b><span class="badge ${k>=9?"ok":k>=6?"warn":"bad"}">${k>=9?"Sẵn sàng triển khai":k>=6?"Cần bổ sung":"Chưa sẵn sàng"}</span></b></div>`; });
}}
